[package]
name = "knowledge-dock"
version = "0.8.41"
description = "uTools 风格的本地知识库悬浮检索工具"
edition = "2021"
# 存在额外 bin（sync_diag 诊断工具）时，tauri build 需显式主二进制
default-run = "knowledge-dock"

[lib]
name = "knowledge_dock_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
open = "5"
notify = "8"
tantivy = "0.25"
jieba-rs = "0.7"
pulldown-cmark = "0.13"
regex = "1"
once_cell = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# 云端闭环产物：接近 release 的运行性能，同时保留符号与行号用于本地排障。
[profile.dev-release]
inherits = "release"
opt-level = 1
debug = 1
strip = "none"
lto = false
codegen-units = 16
panic = "unwind"
