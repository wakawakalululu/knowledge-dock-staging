[package]
name = "knowledge-dock"
version = "0.2.0"
description = "uTools 风格的本地知识库悬浮检索工具"
edition = "2021"

[lib]
name = "knowledge_dock_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
open = "5"
notify = "8"

[profile.release]
strip = true
lto = true
codegen-units = 1
