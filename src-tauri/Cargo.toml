[package]
name = "knowledge-dock"
version = "0.8.43"
description = "uTools 风格的本地知识库悬浮检索工具"
edition = "2021"
# 存在额外 bin（sync_diag 诊断工具）时，tauri build 需显式主二进制
default-run = "knowledge-dock"

[lib]
name = "knowledge_dock_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
open = "5"
notify = "8"
tantivy = "0.25"
jieba-rs = "0.7"
pulldown-cmark = "0.13"
regex = "1"
once_cell = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# 划词搜索：复用 Tauri 已依赖的 windows 0.62 绑定；仅 Windows UI Automation/Win32，无网络功能。
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# 云端闭环产物：接近 release 的运行性能，同时保留符号与行号用于本地排障。
[profile.dev-release]
inherits = "release"
opt-level = 1
debug = 1
strip = "none"
lto = false
codegen-units = 16
panic = "unwind"
