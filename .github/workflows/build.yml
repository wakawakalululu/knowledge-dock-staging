name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "发版版本号（如 v0.1.0，留空则仅编译出 artifact）"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Generate icons (kept out of git, built from source script)
        run: |
          node scripts/gen-icon.mjs
          npx tauri icon scripts/app-icon.png -o src-tauri/icons

      - name: Build
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/knowledge-dock.exe dist/knowledge-dock-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-dock-windows
          path: dist/
          if-no-files-found: error

      - name: Release (tag push or manual dispatch with version)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
          files: dist/*
          generate_release_notes: true
